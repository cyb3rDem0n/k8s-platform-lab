apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello.componentName" (dict "ctx" . "component" "backend") }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

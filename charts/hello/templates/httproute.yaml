{{- if .Values.httpRoute.enabled }}
{{- $be := dict "ctx" . "component" "backend" -}}
{{- $fe := dict "ctx" . "component" "frontend" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hello.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello.labels" $fe | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: {{ include "hello.componentName" $be }}
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "hello.componentName" $fe }}
          port: 80
{{- if .Values.httpRoute.httpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hello.fullname" . }}-http-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello.labels" $fe | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}

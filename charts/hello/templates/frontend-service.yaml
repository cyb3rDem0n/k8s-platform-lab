{{- $ctx := dict "ctx" . "component" "frontend" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hello.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http

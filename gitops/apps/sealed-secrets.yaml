# Sealed Secrets: permette di mettere in Git Secret CIFRATI con la chiave pubblica del cluster.
# Solo il controller (che ha la chiave privata) può decifrarli. Wave -1: prima delle app che li usano.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.17.3
    helm:
      releaseName: sealed-secrets-controller   # nome atteso di default dalla CLI kubeseal
      valuesObject:
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }

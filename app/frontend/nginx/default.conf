# Frontend statico + reverse proxy verso il backend.
#
# In Kubernetes il nome "hello-backend" è il Service ClusterIP nello STESSO namespace:
# il DNS del cluster lo risolve in hello-backend.<ns>.svc.cluster.local.
# Con Docker Compose è il nome del servizio: stessa configurazione, due ambienti.
#
# Nota: quando arriveremo al Gateway API, le richieste /api/* verranno instradate
# DIRETTAMENTE al backend dal Gateway (HTTPRoute) e questo proxy diventerà un fallback.
upstream backend {
    server hello-backend:8080;
    keepalive 16;
}

server {
    listen       8080;
    server_name  _;
    server_tokens off;

    # Header di sicurezza di base per una pagina statica.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    root   /usr/share/nginx/html;
    index  index.html;

    # Probe per Kubernetes: risponde nginx stesso, non dipende dal backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;   # le risposte dell'LLM su CPU possono essere lente
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

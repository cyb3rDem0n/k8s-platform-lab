apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate      # volume RWO: il vecchio Pod deve liberarlo prima che parta il nuovo
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: ollama/ollama:0.12.6
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"          # tiene il modello in RAM 30 minuti dopo l'ultima richiesta
            - name: OLLAMA_NUM_PARALLEL
              value: "1"            # su CPU una richiesta alla volta è la scelta più stabile
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              memory: 6Gi
          readinessProbe:
            httpGet: { path: /api/version, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/version, port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

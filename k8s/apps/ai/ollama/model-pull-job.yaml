# Scarica il modello dopo ogni sync di Argo CD (hook PostSync). Idempotente: se il modello
# c'è già, Ollama risponde subito. Il nome del modello deve coincidere con OLLAMA_MODEL del backend.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull-model
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pull
          image: curlimages/curl:8.20.0
          args:
            - --fail-with-body
            - --silent
            - --show-error
            - --max-time
            - "1800"
            - -X
            - POST
            - http://ollama:11434/api/pull
            - -d
            - '{"model":"qwen2.5:1.5b","stream":false}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

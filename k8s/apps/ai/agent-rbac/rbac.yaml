# Identità dedicata per agenti AI (k8sgpt CLI, server MCP, assistenti di coding) che interrogano il cluster.
# Principio del minimo privilegio: SOLO lettura, e senza accesso ai Secret.
# Il ClusterRole predefinito "view" esclude già i Secret: lo riusiamo invece di scriverne uno.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-readonly
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: ai-agent-readonly
    namespace: ai

# Gateway API: la route "si aggancia" al Gateway condiviso (creato dalla piattaforma, namespace nginx-gateway).
# Separazione dei ruoli: il team piattaforma possiede il Gateway, il team applicativo possiede la route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: lab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - hello.lab.home.arpa
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: hello-backend
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: hello-frontend
          port: 80
---
# Redirect HTTP -> HTTPS: una route separata agganciata al listener http.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-http-redirect
spec:
  parentRefs:
    - name: lab-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - hello.lab.home.arpa
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

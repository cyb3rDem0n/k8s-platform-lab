# Richiede metrics-server (installato con Terraform). Scala sull'uso di CPU RELATIVO alla request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # evita il "flapping" su/giù

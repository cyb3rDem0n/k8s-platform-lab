[defaults]
inventory = inventory/hosts.ini
host_key_checking = True        ; verifica la chiave SSH del NUC: fai prima un ssh manuale per accettarla
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml            ; output leggibile (sostituisce il vecchio stdout_callback=yaml)

[privilege_escalation]
become = True
become_method = sudo
